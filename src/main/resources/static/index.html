<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResolveFlow AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">

    <header class="topbar">
        <div>
            <h1>ResolveFlow AI</h1>
            <p>Intelligent Issue Resolution Assistant</p>
        </div>

        <button class="history-button" onclick="loadHistory()">
            History
        </button>
    </header>

    <main class="chat-wrapper">

        <div id="chatBox" class="chat-box">

            <div class="message ai-message">
                <div class="message-label">ResolveFlow AI</div>
                <div class="message-content">
                    Hi! Describe your problem and I’ll help you find a structured solution.
                </div>
            </div>

        </div>

        <div class="input-area">

            <textarea
                id="promptInput"
                placeholder="Describe your problem..."
                maxlength="2000"
                rows="3"></textarea>

            <button id="sendButton" onclick="sendPrompt()">
                Send
            </button>

        </div>

    </main>

</div>

<div id="historyPanel" class="history-panel">

    <div class="history-header">
        <h2>Conversation History</h2>

        <div class="history-actions">
            <button class="clear-history-button" onclick="clearHistory()">
                Clear
            </button>

            <button class="close-button" onclick="closeHistory()">
                ×
            </button>
        </div>
    </div>

    <div id="historyContent" class="history-content">
        Loading...
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
